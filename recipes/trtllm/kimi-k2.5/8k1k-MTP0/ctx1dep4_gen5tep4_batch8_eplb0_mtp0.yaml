name: ctx1dep4_gen5tep4_batch8_eplb0_mtp0

model:
  path: /lustre/fsw/core_dlfw_ci/rihuo/nvidia_Kimi-K2.5-NVFP4
  container: /lustre/fsw/core_dlfw_ci/rihuo/dynamo-trtllm-arm64-48028352.sqsh
  precision: fp4

resources:
  gpu_type: gb200
  prefill_nodes: 1
  prefill_workers: 1
  gpus_per_prefill: 4
  decode_workers: 5
  decode_nodes: 5
  gpus_per_node: 4
  gpus_per_decode: 4

backend:

  type: trtllm

  prefill_environment:
    ENROOT_ALLOW_DEV: 'yes'
    NCCL_GRAPH_MIXING_SUPPORT: '0'
    TLLM_LOG_LEVEL: INFO
    TRTLLM_ENABLE_PDL: '1'
    TRTLLM_SERVER_DISABLE_GC: '1'
    TRTLLM_WORKER_DISABLE_GC: '1'

  decode_environment:
    ENROOT_ALLOW_DEV: 'yes'
    NCCL_GRAPH_MIXING_SUPPORT: '0'
    TLLM_AUTOTUNER_LOG_LEVEL_DEBUG_TO_INFO: '1'
    TLLM_LOG_LEVEL: INFO
    TRTLLM_ENABLE_PDL: '1'
    TRTLLM_SERVER_DISABLE_GC: '1'
    TRTLLM_WORKER_DISABLE_GC: '1'

  trtllm_config:
    prefill:
      max_batch_size: 2
      max_num_tokens: 16384
      max_seq_len: 8232
      tensor_parallel_size: 4
      moe_expert_parallel_size: 4
      enable_attention_dp: true
      pipeline_parallel_size: 1
      print_iter_log: true
      trust_remote_code: true
      cuda_graph_config: null
      disable_overlap_scheduler: true
      moe_config:
        backend: TRTLLM
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.4
        dtype: fp8
      cache_transceiver_config:
        max_tokens_in_buffer: 16384
        backend: UCX
    decode:
      tensor_parallel_size: 4
      moe_expert_parallel_size: 4
      enable_attention_dp: false
      enable_lm_head_tp_in_adp: false
      pipeline_parallel_size: 1
      max_batch_size: 8
      max_num_tokens: 8
      max_seq_len: 9256
      cuda_graph_config:
        enable_padding: true
        batch_sizes:
        - 1
        - 2
        - 4
        - 8
      print_iter_log: true
      trust_remote_code: true
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.9
        dtype: fp8
      moe_config:
        backend: TRTLLM
        use_low_precision_moe_combine: true
      cache_transceiver_config:
        max_tokens_in_buffer: 16384
        backend: UCX
      stream_interval: 100
      num_postprocess_workers: 4
      nvfp4_gemm_config:
        allowed_backends:
        - cutlass
        - cublaslt
        - cutedsl
        - cuda_core

benchmark:
  type: sa-bench
  isl: 8192
  osl: 1024
  concurrencies: '60'
  req_rate: inf
  random_range_ratio: 0.8

frontend:
  type: dynamo
  enable_multiple_frontends: false


dynamo:
  install: false
