name: ctx2dep4_gen1dep16_batch128_eplb0_mtp1

extra_mount:
  - "/lustre/fsw/core_dlfw_ci/rihuo/nvidia_Kimi-K2.5-Thinking-Eagle3:/lustre/fsw/core_dlfw_ci/rihuo/nvidia_Kimi-K2.5-Thinking-Eagle3"

model:
  path: /lustre/fsw/core_dlfw_ci/rihuo/nvidia_Kimi-K2.5-NVFP4
  container: /lustre/fsw/core_dlfw_ci/rihuo/dynamo-trtllm-arm64-48028352.sqsh
  precision: fp4

resources:
  gpu_type: gb200
  prefill_nodes: 2
  prefill_workers: 2
  gpus_per_prefill: 4
  decode_workers: 1
  decode_nodes: 4
  gpus_per_node: 4
  gpus_per_decode: 16

backend:

  type: trtllm

  prefill_environment:
    ENROOT_ALLOW_DEV: 'yes'
    NCCL_GRAPH_MIXING_SUPPORT: '0'
    TLLM_LOG_LEVEL: INFO
    TRTLLM_ENABLE_PDL: '1'
    TRTLLM_SERVER_DISABLE_GC: '1'
    TRTLLM_WORKER_DISABLE_GC: '1'

  decode_environment:
    ENROOT_ALLOW_DEV: 'yes'
    NCCL_GRAPH_MIXING_SUPPORT: '0'
    TLLM_AUTOTUNER_LOG_LEVEL_DEBUG_TO_INFO: '1'
    TLLM_LOG_LEVEL: INFO
    TRTLLM_ENABLE_PDL: '1'
    TRTLLM_SERVER_DISABLE_GC: '1'
    TRTLLM_WORKER_DISABLE_GC: '1'

  trtllm_config:
    prefill:
      max_batch_size: 16
      max_num_tokens: 16384
      max_seq_len: 1064
      tensor_parallel_size: 4
      moe_expert_parallel_size: 4
      enable_attention_dp: true
      pipeline_parallel_size: 1
      print_iter_log: true
      trust_remote_code: true
      cuda_graph_config: null
      disable_overlap_scheduler: true
      moe_config:
        backend: TRTLLM
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.4
        dtype: fp8
      cache_transceiver_config:
        max_tokens_in_buffer: 16384
        backend: UCX
      speculative_config:
        decoding_type: Eagle
        max_draft_len: 1
        speculative_model_dir: /lustre/fsw/core_dlfw_ci/rihuo/nvidia_Kimi-K2.5-Thinking-Eagle3
    decode:
      tensor_parallel_size: 16
      moe_expert_parallel_size: 16
      enable_attention_dp: true
      enable_lm_head_tp_in_adp: true
      pipeline_parallel_size: 1
      max_batch_size: 128
      max_num_tokens: 256
      max_seq_len: 2088
      cuda_graph_config:
        enable_padding: true
        batch_sizes:
        - 1
        - 2
        - 4
        - 8
        - 16
        - 24
        - 32
        - 40
        - 48
        - 56
        - 64
        - 72
        - 80
        - 88
        - 96
        - 104
        - 112
        - 120
        - 128
      print_iter_log: true
      trust_remote_code: true
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.7
        dtype: fp8
      moe_config:
        backend: TRTLLM
        use_low_precision_moe_combine: true
      cache_transceiver_config:
        max_tokens_in_buffer: 16384
        backend: UCX
      stream_interval: 100
      num_postprocess_workers: 4
      nvfp4_gemm_config:
        allowed_backends:
        - cutlass
        - cublaslt
        - cutedsl
        - cuda_core
      speculative_config:
        decoding_type: Eagle
        max_draft_len: 1
        speculative_model_dir: /lustre/fsw/core_dlfw_ci/rihuo/nvidia_Kimi-K2.5-Thinking-Eagle3

benchmark:
  type: sa-bench
  isl: 1024
  osl: 1024
  concurrencies: '2253'
  req_rate: inf
  random_range_ratio: 0.8

frontend:
  type: dynamo
  enable_multiple_frontends: true
  nginx_container: /lustre/fsw/core_dlfw_ci/rihuo/nginx.sqsh


dynamo:
  install: false
