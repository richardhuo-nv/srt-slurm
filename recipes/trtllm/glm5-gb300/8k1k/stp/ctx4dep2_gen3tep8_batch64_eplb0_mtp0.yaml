name: "ctx4dep2_gen3tep8_batch64_eplb0_mtp0"

model:
  path: "/lustre/fsw/core_dlfw_ci/rihuo/nvidia_GLM-5-NVFP4"
  container: "/lustre/fsw/core_dlfw_ci/rihuo/dynamo-trtllm-arm64-48156767.sqsh"
  precision: "fp4"

resources:
  gpu_type: "gb300"
  prefill_nodes: 2
  prefill_workers: 4
  gpus_per_prefill: 2

  decode_workers: 3
  decode_nodes: 6

  gpus_per_node: 4

backend:
  type: trtllm

  prefill_environment:
    TLLM_LOG_LEVEL: "INFO"
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    TRTLLM_ENABLE_PDL: "1"
    ENROOT_ALLOW_DEV: "yes"
    MIMALLOC_PURGE_DELAY: "0"

  decode_environment:
    TLLM_LOG_LEVEL: "INFO"
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    TRTLLM_ENABLE_PDL: "1"
    ENROOT_ALLOW_DEV: "yes"
    MIMALLOC_PURGE_DELAY: "0"

  trtllm_config:
    prefill:
      max_batch_size: 2
      max_num_tokens: 16640
      max_seq_len: 8232
      tensor_parallel_size: 2
      moe_expert_parallel_size: 2
      enable_attention_dp: true
      pipeline_parallel_size: 1
      print_iter_log: true
      cuda_graph_config: null
      disable_overlap_scheduler: true
      moe_config:
        backend: CUTEDSL
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.6
        dtype: fp8
      cache_transceiver_config:
        max_tokens_in_buffer: 16384
        backend: UCX
      custom_tokenizer: glm_moe_dsa

    decode:
      tensor_parallel_size: 8
      moe_expert_parallel_size: 8
      enable_attention_dp: false
      enable_lm_head_tp_in_adp: false
      pipeline_parallel_size: 1
      max_batch_size: 64
      max_num_tokens: 64
      max_seq_len: 9256
      cuda_graph_config:
        enable_padding: true
        batch_sizes:
        - 1
        - 2
        - 4
        - 8
        - 16
        - 24
        - 32
        - 40
        - 48
        - 56
        - 64
      print_iter_log: true
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.9
        dtype: fp8
      moe_config:
        backend: TRTLLM
        use_low_precision_moe_combine: true
      nvfp4_gemm_config:
        allowed_backends:
        - cutlass
        - cublaslt
        - cutedsl
        - cuda_core
      cache_transceiver_config:
        max_tokens_in_buffer: 16384
        backend: UCX
      stream_interval: 100
      num_postprocess_workers: 4
      allreduce_strategy: MNNVL
      custom_tokenizer: glm_moe_dsa

benchmark:
  custom_tokenizer: "glm_moe_dsa"
  use_chat_template: false
  type: "sa-bench"
  isl: 8192
  osl: 1024
  concurrencies: "231"
  req_rate: "inf"

frontend:
  type: "dynamo"
  enable_multiple_frontends: true
  nginx_container: "/lustre/fsw/core_dlfw_ci/rihuo/nginx.sqsh"

dynamo:
  install: false

infra:
  etcd_nats_dedicated_node: true
