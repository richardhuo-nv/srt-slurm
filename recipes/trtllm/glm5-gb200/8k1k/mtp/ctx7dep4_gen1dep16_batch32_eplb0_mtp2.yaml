name: "ctx7dep4_gen1dep16_batch32_eplb0_mtp2"

model:
  path: "/lustre/fsw/core_dlfw_ci/rihuo/nvidia_GLM-5-NVFP4"
  container: "/lustre/fsw/core_dlfw_ci/rihuo/dynamo-trtllm-glm-2-0.sqsh"
  precision: "fp4"

resources:
  gpu_type: "gb200"
  prefill_nodes: 7
  prefill_workers: 7

  decode_workers: 1
  decode_nodes: 4

  gpus_per_node: 4

backend:
  type: trtllm

  prefill_environment:
    TLLM_LOG_LEVEL: "INFO"
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    TRTLLM_ENABLE_PDL: "1"
    ENROOT_ALLOW_DEV: "yes"
    MIMALLOC_PURGE_DELAY: "0"

  decode_environment:
    TLLM_LOG_LEVEL: "INFO"
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    TRTLLM_ENABLE_PDL: "1"
    ENROOT_ALLOW_DEV: "yes"
    MIMALLOC_PURGE_DELAY: "0"

  trtllm_config:
    prefill:
      max_batch_size: 2
      max_num_tokens: 16640
      max_seq_len: 8232
      tensor_parallel_size: 4
      moe_expert_parallel_size: 4
      enable_attention_dp: true
      pipeline_parallel_size: 1
      print_iter_log: true
      cuda_graph_config: null
      disable_overlap_scheduler: true
      moe_config:
        backend: CUTEDSL
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.6
        dtype: fp8
      cache_transceiver_config:
        max_tokens_in_buffer: 16384
        backend: UCX
      custom_tokenizer: glm_moe_dsa
      speculative_config:
        decoding_type: MTP
        num_nextn_predict_layers: 2

    decode:
      tensor_parallel_size: 16
      moe_expert_parallel_size: 16
      enable_attention_dp: true
      enable_lm_head_tp_in_adp: true
      pipeline_parallel_size: 1
      max_batch_size: 32
      max_num_tokens: 96
      max_seq_len: 9256
      cuda_graph_config:
        enable_padding: true
        batch_sizes:
        - 1
        - 2
        - 4
        - 8
        - 16
        - 24
        - 32
      print_iter_log: true
      kv_cache_config:
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.7
        dtype: fp8
      moe_config:
        backend: CUTEDSL
        use_low_precision_moe_combine: true
      nvfp4_gemm_config:
        allowed_backends:
        - cutlass
        - cublaslt
        - cutedsl
        - cuda_core
      cache_transceiver_config:
        max_tokens_in_buffer: 16384
        backend: UCX
      stream_interval: 100
      num_postprocess_workers: 4
      custom_tokenizer: glm_moe_dsa
      speculative_config:
        decoding_type: MTP
        num_nextn_predict_layers: 2

benchmark:
  custom_tokenizer: "glm_moe_dsa"
  use_chat_template: false
  type: "sa-bench"
  isl: 8192
  osl: 1024
  concurrencies: "615"
  req_rate: "inf"

frontend:
  type: "dynamo"
  enable_multiple_frontends: true
  nginx_container: "/lustre/fsw/core_dlfw_ci/rihuo/nginx.sqsh"

dynamo:
  install: false

infra:
  etcd_nats_dedicated_node: true
